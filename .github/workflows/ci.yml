name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Ensure single root package-lock.json
      run: |
        LOCKFILES=$(find . -name "package-lock.json" -not -path "./package-lock.json" -not -path "*/node_modules/*")
        if [ ! -z "$LOCKFILES" ]; then
          echo "ERROR: Found package-lock.json outside of repository root:"
          echo "$LOCKFILES"
          echo "Workspaces must use a single root lockfile."
          exit 1
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Tests
      run: npm test

    - name: Build Application
      run: npm run build

    - name: Lint Code
      run: npm run lint
