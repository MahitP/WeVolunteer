<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="WeVolunteer">
  <!--
    WeVolunteer browser tab icon: the checkmark-W, white, on the Forest tile.

    This is the small-size drawing. A tab icon is rasterised at 16, 32 and 48
    pixels, where the mark itself is 9 to 28 pixels tall, and the Identity
    Proposal permits exactly one deviation there: the stroke thickens from 12.5 to
    15.5 units so the mark does not grey out against the tile. Nothing else about
    the drawing changes.

    The geometry is a copy of src/components/common/logoGeometry.js, because this
    file is fetched by the browser chrome, outside the document, where no module
    is in scope. The colour is written literally for the same reason: no custom
    property reaches a tab icon. src/logoAssets.test.jsx fails the build if the
    points, the stroke, the joins or the colour here stop matching the source.

    Tile: corner radius 0.2236 of the side, mark box 0.58 of the side, centred.
    The mark is placed with a plain transform rather than a nested svg element:
    some icon rasterisers outside the browser ignore a nested viewport.

    Note for future edits: XML comments may not contain a double hyphen.
  -->
  <rect width="64" height="64" rx="14.31" fill="#0f5a3a"/>
  <path transform="translate(10.729 14.691) scale(0.41708)" d="M16 26 L33 78 L50 34 L67 78 L86 4" fill="none" stroke="#ffffff" stroke-width="15.5" stroke-linejoin="bevel" stroke-linecap="butt" stroke-miterlimit="1"/>
</svg>
