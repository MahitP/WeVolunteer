<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="WeVolunteer">
  <!--
    WeVolunteer browser mark.

    Replaces a purple gradient glyph (#863bff / #7e14ff / #47bfff) left over from
    another product: the tab icon shared neither the colour nor the form of
    anything else here, so the one piece of WeVolunteer visible when a tab was not
    focused was off brand.

    This is deliberately the SAME mark that already appears in two places, so all
    three now agree:
      the email header    #0f6b45 tile, white bold "WV" (server/email.js)
      the Welcome screen  .welcome-mark, brand tile, white bold "WV"

    #0f6b45 is written literally rather than as a CSS custom property, because
    this file is fetched by the browser chrome, outside the document, where no
    custom property is in scope. It is the resolved value of the green-600 token
    that feeds the brand token, and it matches `brandColor` in server/email.js
    exactly.

    One green tile for light and dark chrome alike: the mark is the brand's
    constant, and a green dark enough to carry white text reads correctly against
    either.

    The letters are drawn as paths rather than as text. A favicon is rasterised at
    16px by code that may not resolve font-family at all, so a text mark can
    render in a fallback face or vanish; paths look identical everywhere.

    Note for future edits: XML comments may not contain a double hyphen, which is
    why the token names above are written without their leading dashes.
  -->
  <rect width="64" height="64" rx="14" fill="#0f6b45"/>
  <g fill="#ffffff">
    <path d="M6.6 20.5h6.2l2.7 14.4 3.1-14.4h5.4l3.1 14.4 2.7-14.4h6.2l-5.7 23h-6.3l-2.7-13-2.7 13h-6.3z"/>
    <path d="M38.2 20.5h6.6l3.9 15.3 3.9-15.3h6.6l-7 23h-6.9z"/>
  </g>
</svg>
