# WeVolunteer — Nginx site configuration for the single-host deployment.
#
# Install to /etc/nginx/sites-available/wevolunteers.conf and symlink into
# sites-enabled. Validate with `sudo nginx -t` BEFORE reloading: a syntax error
# in this file takes the whole site down on reload, and `nginx -t` is the only
# thing standing between an edit and that.
#
# ── What this serves ──
#
#   /            the built Vite bundle from /srv/wevolunteer/dist  (static, free)
#   /api         proxied to the Express service on 127.0.0.1:5050
#   /socket.io   the same, with the upgrade headers Socket.IO needs
#   /uploads     avatars and organization images, from the writable volume
#   /health      proxied, unlogged, for the uptime monitor
#
# TLS is terminated by Cloudflare and again here with a Cloudflare Origin
# certificate, so the hop from Cloudflare to this host is encrypted and
# verified. Do not run Cloudflare in "Flexible" mode against this: that leaves
# Cloudflare->origin as plaintext HTTP, and the session cookie is marked
# `secure`, so it would be transmitted in clear over that hop.

# ─────────────────────────────────────────────────────────────────────────────
# Restore the visitor's real IP address.
#
# THIS IS A SECURITY CONTROL, not a logging nicety.
#
# Behind Cloudflare every packet arrives from a Cloudflare address. Without
# this block, `$remote_addr` is Cloudflare's, Express sees Cloudflare's, and
# every per-IP rate limiter in the application — the login brute-force limit,
# the IP ceiling, the mail limiter, the certificate-verify limiter — collapses
# into ONE shared bucket for the entire internet. The login limiter would then
# lock out every user at once while an attacker distributed across Cloudflare's
# range stayed under it.
#
# CF-Connecting-IP is set by Cloudflare and, crucially, Cloudflare STRIPS any
# client-supplied copy of it. That is only true for traffic that actually came
# through Cloudflare — which is why the origin firewall must accept 443 only
# from Cloudflare's ranges. If a client can reach this host directly, it can
# forge this header and choose its own rate-limit bucket.
#
# The ranges below must be kept current from https://www.cloudflare.com/ips/.
# Regenerate with:
#   for i in $(curl -s https://www.cloudflare.com/ips-v4); do echo "set_real_ip_from $i;"; done
#   for i in $(curl -s https://www.cloudflare.com/ips-v6); do echo "set_real_ip_from $i;"; done
include /etc/nginx/cloudflare-real-ip.conf;
real_ip_header CF-Connecting-IP;

# Express must also be told to trust the proxy, or it will ignore the restored
# address: TRUST_PROXY=1 in /etc/wevolunteer/wevolunteer.env.

upstream wevolunteer_app {
    server 127.0.0.1:5050;
    keepalive 32;
}

# Compression. `gzip on;` is deliberately NOT here: Ubuntu's /etc/nginx/nginx.conf
# already sets it at http level, and nginx rejects the duplicate — `nginx -t`
# fails with '"gzip" directive is duplicate'. This line was removed by hand on
# the production host on 2026-09-12 to get the site up, and the repository copy
# kept it, so the next provision run would have installed a config that cannot
# load. The tuning below is not set by Ubuntu's file (it ships commented out),
# so it is kept.
gzip_vary         on;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types        text/plain text/css application/javascript application/json
                  image/svg+xml application/manifest+json;

server {
    listen 80;
    listen [::]:80;
    server_name app.wevolunteers.org;
    # Cloudflare already redirects, but a direct request must not be served
    # plaintext either.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.wevolunteers.org;

    # Cloudflare Origin CA certificate — free, 15-year, and trusted by
    # Cloudflare only. It is NOT a public certificate: a browser reaching this
    # host directly would reject it, which is the intended behaviour.
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /srv/wevolunteer/dist;
    index index.html;

    # 5 MB matches the application's own upload limit. Rejecting at the edge
    # keeps an oversized body from occupying a Node worker to be refused anyway.
    client_max_body_size 5m;

    # ── Security headers ─────────────────────────────────────────────────────
    #
    # This section used to say Content-Security-Policy was "deliberately NOT set
    # here" because the application sends its own. The application does — on
    # responses EXPRESS writes. The SPA page, its assets and uploaded pictures
    # are served by this file, never by Express, so the page shipped with no CSP
    # and no HSTS at all while the JSON beside it carried both. Observed on the
    # live site on 2026-09-13.
    #
    # The headers are not written out here by hand, for the reason the old
    # comment gave: a second, drifting copy of the policy would break whichever
    # directive it forgot. They are RENDERED from server/securityHeaders.js by
    # bin/nginx-security-headers.mjs into the snippet below, and a test fails
    # when the snippet and the source disagree. Referrer-Policy is the one
    # deliberate difference; see DOCUMENT_REFERRER_POLICY there.
    #
    # Included in each location nginx answers itself (below), not at server
    # level: a location with its own add_header inherits none from here, and the
    # proxied locations already carry helmet's headers from Express — including
    # them here too is what doubled Referrer-Policy on /live.
    #
    # HSTS carries includeSubDomains, which on this host covers only names under
    # app.wevolunteers.org. helmet already sent it on every API response, so
    # browsers have been applying it here since launch. No preload.

    # ── The application's own routes ─────────────────────────────────────────

    location /api/ {
        proxy_pass         http://wevolunteer_app;
        proxy_http_version 1.1;

        # Host must be the real one: server/app.js compares the request's Host
        # against the Origin header to decide whether a write is same-origin.
        # Passing $proxy_host instead would make every same-origin write look
        # cross-origin and 403.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Long enough for a data export to be assembled, short enough that a
        # wedged request is eventually released.
        proxy_read_timeout 120s;

        # An authenticated API response must never be cached by anything —
        # not Nginx, not Cloudflare, not the browser. One cached response
        # served to a second user is a cross-account data leak.
        #
        # The application now says `Cache-Control: no-store` on every /api
        # response itself (server/app.js, asserted in
        # server/apiCacheIsolation.test.js), so this is defence in depth rather
        # than the only line. It stays because this file may front something
        # else one day, and because `always` covers responses Nginx generates
        # on its own — a 502 from a restarting upstream never reaches Express.
        #
        # `add_header` APPENDS; it does not replace the upstream header. A
        # proxied /api response therefore carries two Cache-Control lines,
        # which a cache reads as one list. Every directive in both is
        # restrictive, so the union is too — two lines are expected, not a
        # misconfiguration.
        proxy_no_cache     1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    }

    location /socket.io/ {
        proxy_pass         http://wevolunteer_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cloudflare's free plan closes an idle proxied WebSocket at ~100s, so
        # the application's own ping must be under that. This timeout only needs
        # to exceed the ping interval, not the session length.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Map tiles, relayed by the application so a student's browser never
    # contacts a map provider (server/routes/tileRoutes.js). Without this block
    # `location /` would answer a tile with index.html and every map would be
    # blank. The application sets Cache-Control itself: public for a tile, so
    # Cloudflare can cache it at the edge, and no-store for any refusal.
    location /tiles/ {
        proxy_pass         http://wevolunteer_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 15s;
    }

    # Uploaded images, from the writable volume rather than the read-only
    # checkout. Must match WEV_UPLOADS_DIR in the service environment.
    #
    # `immutable` is safe because the application mints a NEW filename on every
    # replacement (the name carries a timestamp), so the bytes behind a given
    # URL never change.
    location /uploads/ {
        alias /var/lib/wevolunteer/uploads/;
        autoindex off;
        # nosniff arrives with the snippet, alongside a CSP: an uploaded file
        # opened directly as a page can run nothing.
        include /etc/nginx/snippets/wevolunteers-security-headers.conf;
        # No `always`: add_header without it applies only to successful and
        # redirect responses. With it, a 404 or 403 for a picture was also
        # marked immutable for a year, and Cloudflare cached it — observed
        # 2026-09-13, when a probe's 403 stayed at the edge after the origin
        # was fixed. The security headers above keep `always`.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # These are user-supplied bytes. Never let one be interpreted as a
        # document in this origin.
        add_header Content-Disposition "inline" always;
        types { image/jpeg jpg jpeg; image/png png; image/webp webp; image/avif avif; }
        default_type application/octet-stream;
    }

    location = /health {
        proxy_pass       http://wevolunteer_app;
        proxy_set_header Host $host;
        # The uptime monitor hits this every minute; logging it buries
        # everything else.
        access_log off;
    }

    location = /live {
        proxy_pass       http://wevolunteer_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /ready {
        proxy_pass       http://wevolunteer_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Static assets ────────────────────────────────────────────────────────
    #
    # Vite fingerprints every file in /assets with a content hash, so a changed
    # file is a changed URL and these can be cached for a year. This is what
    # makes serving the frontend from one small VM cheap: after the first
    # visit, Cloudflare answers almost everything without touching the origin.
    location /assets/ {
        include /etc/nginx/snippets/wevolunteers-security-headers.conf;
        # No `always`, for the reason given under /uploads/: a 404 for a hashed
        # asset must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be cached like that. It is the file that names the
    # current hashed bundles, so a stale copy points browsers at assets that no
    # longer exist and the app fails to boot after every deploy — the classic
    # "hard refresh fixes it" bug.
    location = /index.html {
        include /etc/nginx/snippets/wevolunteers-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    #
    # React Router owns /dashboard, /certificates/:code, /owner and the rest.
    # Those paths do not exist on disk, so a refresh or a pasted deep link must
    # be answered with index.html and routed client-side. Without this, every
    # link into the application 404s — while the site appears to work perfectly
    # as long as you only ever navigate from the home page.
    #
    # It sits LAST so it cannot shadow /api, /uploads or the asset rules above.
    location / {
        include /etc/nginx/snippets/wevolunteers-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
