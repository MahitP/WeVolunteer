<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      One mark, in every place the browser draws one.

      `favicon.svg` is the checkmark-W, white, on a #0f5a3a (Forest) tile — the
      same badge `.brand-mark` renders in the app, drawn at the small-size stroke
      weight a 16px tab needs. The colour is written literally because a tab icon
      is fetched outside the document, where no CSS custom property is in scope.
      `--brand-mark-bg` in index.css is the in-app half of that same pair, and it
      is deliberately not overridden in dark mode.

      `mask-icon` covers Safari's pinned tabs, which render a one-colour
      silhouette. It points at the bare mark, not the tiled favicon, whose
      silhouette is a plain square.

      `apple-touch-icon` is the home-screen icon on iPhone and iPad, where the
      owner asked for "Add to Home Screen" (ruling 9). Without it iOS uses a
      screenshot of the page. It is the maskable drawing rendered at 180px with
      no transparency, because iOS masks the corners itself and fills any
      transparent pixel with black.

      There is deliberately no Open Graph image: it describes a page to a link
      preview on somebody else's service, which is not something to add to a
      platform whose members are children and whose profiles are gated behind a
      session for exactly that reason.
    -->
    <link rel="mask-icon" href="/mark.svg" color="#0f5a3a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Styles the pre-mount placeholder in #root; inline styles are blocked by the CSP. -->
    <link rel="stylesheet" href="/boot.css" />
    <meta name="theme-color" content="#0f5a3a" />
    <meta name="description" content="Volunteer scheduling and service-hour tracking for schools." />
    <!--
      viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
      values on iOS. index.css already accounts for the notch and the home
      indicator in twelve places — including padding-bottom on .mobilenav and
      .app — but without this attribute Safari reports every inset as 0px, so all
      of that work was inert and the bottom navigation and message composer sat
      inside the home-indicator gesture area on every iPhone since the X.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WeVolunteer</title>
    <script src="/theme.js"></script>
    <!--
      Accessibility preferences, before the first paint, for the same reason
      theme.js is here: a text-size or contrast setting applied after React
      mounts is a visible flash of the interface the reader said they could not
      use. See src/hooks/useAccessibilityPreferences.js for the other half.
    -->
    <script src="/a11y-prefs.js"></script>
  </head>
  <body>
    <div id="root"><div class="boot"><img class="boot-mark" src="/favicon.svg" alt="" width="56" height="56" /><span>WeVolunteer</span></div></div>
    <noscript>WeVolunteer needs JavaScript to run. Turn it on in your browser's settings and reload this page.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
